name: Sanskrit Chant Batch 01

on:
  push:
    branches: [mantra-audio-lab]
    paths:
      - "mantra_audio/verified_batch_01.json"
      - ".github/workflows/sanskrit-chant-batch-01.yml"
  workflow_dispatch:

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1+cpu torchaudio==2.4.1+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install Sanskrit chant engine
        run: |
          pip install cowchant
          pip install scipy soundfile numpy

      - name: Render and mix group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from scipy.signal import butter, sosfilt

          root = Path("mantra_audio")
          group = int(os.environ["GROUP"])
          raw_dir = root / f"batch01_raw_g{group}"
          mix_dir = root / f"batch01_mixed_g{group}"
          raw_dir.mkdir(exist_ok=True)
          mix_dir.mkdir(exist_ok=True)

          with open(root / "verified_batch_01.json", encoding="utf-8") as f:
              all_items = json.load(f)

          start = group * 4
          items = all_items[start:start+4]

          def safe(s):
              return re.sub(r"[^A-Za-z0-9_-]+", "_", s).strip("_")

          def music_bed(n, sr):
              t = np.arange(n)/sr
              rootf = 146.83
              drone = (
                  0.60*np.sin(2*np.pi*rootf*t) +
                  0.22*np.sin(2*np.pi*(rootf*1.5)*t) +
                  0.14*np.sin(2*np.pi*(rootf*2)*t) +
                  0.08*np.sin(2*np.pi*(rootf/2)*t)
              )
              pad = (
                  0.34*np.sin(2*np.pi*220.00*t + 0.3) +
                  0.22*np.sin(2*np.pi*293.66*t + 1.1) +
                  0.15*np.sin(2*np.pi*369.99*t + 2.0)
              )
              breathing = 0.74 + 0.26*np.sin(2*np.pi*0.05*t - 0.5)
              bg = (drone + 0.58*pad) * breathing
              sos = butter(4, 1150, btype="low", fs=sr, output="sos")
              bg = sosfilt(sos, bg)
              fade_n = max(1, int(sr*1.0))
              fade = np.ones(n)
              fade[:fade_n] = np.linspace(0,1,fade_n)
              fade[-fade_n:] = np.linspace(1,0,fade_n)
              bg *= fade
              peak = np.max(np.abs(bg)) or 1.0
              return bg/peak

          for offset, item in enumerate(items, 1):
              base = f'{item["id"]}_{safe(item["name"])}'
              raw = raw_dir / f"{base}.wav"
              out = mix_dir / f"{base}_SOFT_MUSIC.wav"
              print(f"[group {group} {offset}/{len(items)}] Rendering {item['id']} {item['name']}", flush=True)

              subprocess.run([
                  "cowchant", item["text"],
                  "--device", "cpu",
                  "--speed", "0.84",
                  "--seed", str(60 + start + offset),
                  "-o", str(raw),
              ], check=True)

              voice, sr = sf.read(raw, always_2d=True)
              voice = voice.mean(axis=1)
              bg = music_bed(len(voice), sr)

              vpk = np.max(np.abs(voice)) or 1.0
              voice = voice / vpk * 0.78
              mix = voice + 0.22*bg

              peak = np.max(np.abs(mix)) or 1.0
              if peak > 0.97:
                  mix = mix/peak*0.97
              sf.write(out, mix, sr, subtype="PCM_16")
              print(f"Wrote {out}", flush=True)
          PY

      - name: Package group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          cd mantra_audio
          zip -j "Sanskrit_Chant_Batch_01_Group_${GROUP}.zip" "batch01_mixed_g${GROUP}"/*.wav

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanskrit-chant-batch-01-group-${{ matrix.group }}
          path: |
            mantra_audio/batch01_mixed_g${{ matrix.group }}/*.wav
            mantra_audio/Sanskrit_Chant_Batch_01_Group_${{ matrix.group }}.zip
          retention-days: 7
