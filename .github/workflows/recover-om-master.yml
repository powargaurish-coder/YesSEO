name: Recover Corrected Om Namah Shivaya Master

on:
  push:
    branches: [mantra-audio-lab]
    paths:
      - ".github/workflows/recover-om-master.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio libs
        run: pip install numpy soundfile scipy requests

      - name: Recover clean single repetition
        run: |
          python - <<'PY'
          import requests, numpy as np, soundfile as sf
          from scipy.ndimage import uniform_filter1d
          from pathlib import Path

          url = "https://resource2.heygen.ai/text_to_speech/5769a58268d349e9a0ada6adf179aa83/da9659970e9d4250be76c3f628565bc7/id=53984665eea640f091cb85448ab61a3e.wav"
          root = Path("mantra_audio/recovered_om")
          root.mkdir(parents=True, exist_ok=True)
          src = root / "female_9x.wav"
          r = requests.get(url, timeout=60)
          r.raise_for_status()
          src.write_bytes(r.content)

          y, sr = sf.read(src, always_2d=True)
          y = y.mean(axis=1)

          # The source was generated as exactly 9 repetitions.
          # Use one full ninth so the entire "Om Namah Shivaya" phrase is retained.
          step = len(y) // 9
          rep = y[:step]

          # gentle fade
          f=min(int(sr*0.05), len(rep)//4)
          if f>0:
              rep[:f] *= np.linspace(0,1,f)
              rep[-f:] *= np.linspace(1,0,f)

          out = root / "P1-013_Om_Namah_Shivaya_CORRECTED_FEMALE_1X.wav"
          sf.write(out, rep, sr, subtype="PCM_16")
          # Also keep the original 9x source for QC.
          sf.write(root / "P1-013_Om_Namah_Shivaya_FEMALE_9X_SOURCE.wav", y, sr, subtype="PCM_16")
          print("duration", len(rep)/sr)
          PY

      - name: Upload corrected master
        uses: actions/upload-artifact@v4
        with:
          name: corrected-om-namah-shivaya-master
          path: |
            mantra_audio/recovered_om/P1-013_Om_Namah_Shivaya_CORRECTED_FEMALE_1X.wav
            mantra_audio/recovered_om/P1-013_Om_Namah_Shivaya_FEMALE_9X_SOURCE.wav
          retention-days: 7
